<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RDOC Giveaway: Join-Animation</title>
<link rel="icon" href="/admin/favicon.ico" sizes="32x32">
<link rel="icon" href="/admin/favicon.svg" type="image/svg+xml">
<style>
  /* OBS-Browser-Source: transparenter Grund, feste RDOC-Literale (kein Theme,
     kein rdoc.css — das wuerde ein opakes body-Background setzen). */
  @font-face { font-family:'Michroma'; src:url('/admin/fonts/Michroma-Regular.ttf') format('truetype'); font-weight:400; font-style:normal; font-display:swap; }
  @font-face { font-family:'IBM Plex Mono'; src:url('/admin/fonts/IBMPlexMono-Regular.ttf') format('truetype'); font-weight:400; font-style:normal; font-display:swap; }
  :root{
    --copper:#C48A4A; --copper-soft:rgba(196,138,74,.55); --ink:#F2F2F0;
    --steel:#76828D; --steel-line:rgba(118,130,141,.4); --mute:rgba(118,130,141,.8);
    --disp:"Michroma","Segoe UI",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:var(--mono)}
  #lane{position:fixed;left:26px;bottom:26px;width:min(60vw,560px);display:flex;flex-direction:column-reverse;gap:8px}

  .card{position:relative;display:flex;align-items:center;gap:16px;padding:13px 18px;
    background:rgba(18,20,22,.85);border:1px solid var(--steel-line);border-left:2px solid var(--copper);
    border-radius:3px;overflow:hidden;
    transform:translateX(-115%);opacity:0;animation:slideIn .42s cubic-bezier(.16,1,.3,1) forwards}
  .card.out{animation:slideOut .34s ease forwards}
  @keyframes slideIn{to{transform:translateX(0);opacity:1}}
  @keyframes slideOut{to{transform:translateX(115%);opacity:0}}
  .qnr{font-size:15px;color:var(--copper);letter-spacing:1px;font-variant-numeric:tabular-nums}
  .dv{width:1px;align-self:stretch;background:var(--steel-line)}
  .txt{flex:1;min-width:0}
  .uname{font-family:var(--disp);font-weight:400;font-size:16px;color:var(--ink);
    letter-spacing:0;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .status{font-size:11px;letter-spacing:2px;color:var(--mute);text-transform:uppercase;margin-top:3px;min-height:1.1em}
  .cur{display:inline-block;width:5px;height:.9em;background:var(--copper);margin-left:2px;vertical-align:-1px;animation:blink .55s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  .qbar{font-size:13px;color:var(--steel);letter-spacing:1px;white-space:nowrap}
  .qbar .c{color:var(--steel-line);margin-left:4px}
  .badge{font-size:10px;color:var(--copper);border:1px solid var(--copper-soft);padding:3px 8px;
    letter-spacing:1px;background:rgba(196,138,74,.08);white-space:nowrap;flex-shrink:0;border-radius:2px}
  .drain{position:absolute;left:0;bottom:0;height:2px;width:100%;transform-origin:left;
    background:var(--copper);animation:drain 4.2s linear forwards}
  @keyframes drain{to{transform:scaleX(0)}}
  @media (prefers-reduced-motion:reduce){.card,.card.out{animation-duration:.01s}.drain{animation:none}.cur{animation:none}}
</style>
</head>
<body>
<div id="lane"></div>
<script src="giveaway-join.js"></script>
</body>
</html>
