<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RDOC Giveaway: Gewinner-Overlay</title>
<link rel="icon" href="/admin/favicon.ico" sizes="32x32">
<link rel="icon" href="/admin/favicon.svg" type="image/svg+xml">
<style>
  /* OBS-Browser-Source: transparenter Grund, feste RDOC-Literale (kein Theme,
     kein rdoc.css — das wuerde ein opakes body-Background setzen). */
  @font-face { font-family:'Michroma'; src:url('/admin/fonts/Michroma-Regular.ttf') format('truetype'); font-weight:400; font-style:normal; font-display:swap; }
  @font-face { font-family:'IBM Plex Mono'; src:url('/admin/fonts/IBMPlexMono-Regular.ttf') format('truetype'); font-weight:400; font-style:normal; font-display:swap; }
  :root{
    --copper:#C48A4A; --copper-soft:rgba(196,138,74,.6); --ink:#F2F2F0; --steel:#76828D;
    --disp:"Michroma","Segoe UI",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

  #winner{position:fixed;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .4s ease}
  #winner.show{opacity:1}
  .card{position:relative;text-align:center;padding:34px 66px;
    background:rgba(18,20,22,.85);
    border:1px solid var(--copper-soft);border-radius:4px;
    transform:scale(.82);opacity:0}
  #winner.show .card{animation:pop .7s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes pop{to{transform:scale(1);opacity:1}}
  .br{position:absolute;width:16px;height:16px;border:2px solid var(--copper);opacity:.9}
  .br.tl{top:-1px;left:-1px;border-right:none;border-bottom:none}
  .br.tr{top:-1px;right:-1px;border-left:none;border-bottom:none}
  .br.bl{bottom:-1px;left:-1px;border-right:none;border-top:none}
  .br.rb{bottom:-1px;right:-1px;border-left:none;border-top:none}
  .scan{position:absolute;left:0;right:0;height:2px;top:0;background:var(--copper);opacity:0}
  #winner.show .scan{animation:scan 1.05s ease-out .15s}
  @keyframes scan{0%{opacity:.85;top:0}100%{opacity:0;top:100%}}
  .win-label{font-family:var(--mono);font-size:13px;letter-spacing:.55em;color:var(--copper);
    text-transform:uppercase;padding-left:.55em;display:flex;align-items:center;justify-content:center;gap:12px}
  .win-label i{height:1px;width:52px;background:var(--copper-soft);font-style:normal}
  .win-name{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:52px;line-height:1.1;
    letter-spacing:0;color:var(--ink);margin-top:16px;text-wrap:balance}
  .win-tickets{margin-top:14px;font-family:var(--mono);font-size:14px;letter-spacing:.22em;color:var(--steel)}
  .win-tickets b{color:var(--copper);font-weight:400;font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:reduce){#winner.show .card{animation:none;transform:scale(1);opacity:1}#winner.show .scan{animation:none}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="winner">
  <div class="card">
    <span class="br tl"></span><span class="br tr"></span><span class="br bl"></span><span class="br rb"></span>
    <div class="scan"></div>
    <div class="win-label"><i></i>Gewinner<i class="r"></i></div>
    <div class="win-name" id="ov-winner-name">-</div>
    <div class="win-tickets"><b id="ov-winner-tickets">0</b></div>
  </div>
</div>
<script src="giveaway-overlay.js"></script>
</body>
</html>
