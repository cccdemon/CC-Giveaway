<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RDOC Giveaway: Benutzerverwaltung</title>
<link rel="stylesheet" href="/admin/rdoc.css">
<script src="/admin/rdoc-theme.js"></script>
<link rel="icon" href="/admin/favicon.ico" sizes="32x32">
<link rel="icon" href="/admin/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/admin/icons/apple-touch-icon.png">
<link rel="manifest" href="/admin/site.webmanifest">
<meta name="theme-color" content="#121416" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F2F0" media="(prefers-color-scheme: light)">
<style>
  .userwrap { max-width:820px; margin:24px auto; padding:0 16px; }
  .panel { background:var(--rdoc-surface); border:1px solid var(--rdoc-border); border-radius:8px; padding:20px; margin-bottom:20px; }
  .panel h2 { font-family:var(--rdoc-font-mono); font-weight:400; font-size:13px; letter-spacing:0.07em; color:var(--rdoc-text); margin-bottom:14px; text-transform:uppercase; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--rdoc-border); }
  th { color:var(--rdoc-text-muted); font-size:11px; letter-spacing:0.07em; text-transform:uppercase; }
  .role { font-family:var(--rdoc-font-mono); font-size:11px; padding:2px 7px; border-radius:4px; background:var(--rdoc-surface); color:var(--rdoc-text); }
  .role.superadmin { background:var(--rdoc-tint-warning); color:var(--rdoc-warning); }
  .row-form { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .row-form .fld { display:flex; flex-direction:column; gap:5px; }
  .row-form label { font-size:11px; letter-spacing:0.07em; color:var(--rdoc-text-muted); text-transform:uppercase; }
  input, select { background:var(--rdoc-bg); border:1px solid var(--rdoc-line-on-surface); color:var(--rdoc-text); padding:9px 10px; border-radius:6px; font-size:13px; outline:none; }
  button { background:var(--rdoc-accent); color:var(--rdoc-on-accent); border:none; padding:9px 16px; border-radius:6px; font-weight:600; cursor:pointer; letter-spacing:.5px; }
  button.danger { background:transparent; border:1px solid var(--rdoc-error); color:var(--rdoc-error); padding:5px 11px; font-size:12px; }
  .msg { margin-top:12px; font-size:12px; min-height:15px; }
  .msg.ok { color:var(--rdoc-success); } .msg.err { color:var(--rdoc-error); }
</style>
</head>
<body data-app>
<script src="/giveaway/cc-defs.js"></script>
<script src="admin-shared.js"></script>
<div class="userwrap">

  <div class="panel">
    <h2>Benutzer anlegen / aktualisieren</h2>
    <form class="row-form" id="addForm">
      <div class="fld"><label>Benutzername</label><input id="nu" required></div>
      <div class="fld"><label>Passwort (min. 8)</label><input id="np" type="password" required></div>
      <div class="fld"><label>Rolle</label>
        <select id="nr">
          <option value="admin">admin</option>
          <option value="superadmin">superadmin</option>
        </select>
      </div>
      <button type="submit">Speichern</button>
    </form>
    <div class="msg" id="addMsg"></div>
  </div>

  <div class="panel">
    <h2>Benutzer</h2>
    <table>
      <thead><tr><th>Benutzer</th><th>Rolle</th><th>Erstellt</th><th>Letzter Login</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="5" style="color:var(--rdoc-text-faint)">lädt…</td></tr></tbody>
    </table>
    <div class="msg" id="listMsg"></div>
  </div>

</div>
<script src="users.js"></script>
</body>
</html>
