<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RDOC Giveaway: Login</title>
<link rel="stylesheet" href="/admin/rdoc.css">
<script src="/admin/rdoc-theme.js"></script>
<link rel="icon" href="/admin/favicon.ico" sizes="32x32">
<link rel="icon" href="/admin/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/admin/icons/apple-touch-icon.png">
<link rel="manifest" href="/admin/site.webmanifest">
<meta name="theme-color" content="#121416" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F2F0" media="(prefers-color-scheme: light)">
<style>
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { width:min(92vw,380px); background:var(--rdoc-surface); border:1px solid var(--rdoc-line-on-surface);
          border-radius:10px; padding:34px 30px; }
  .logo { font-family:var(--rdoc-font-display); font-weight:400; font-size:17px; letter-spacing:0; text-align:center; margin-bottom:4px; }
  .logo b { color:var(--rdoc-text-muted); font-weight:700; }
  .sub { text-align:center; font-family:var(--rdoc-font-mono); font-size:11px; letter-spacing:2px; color:var(--rdoc-text-muted); margin-bottom:26px; text-transform:uppercase; }
  label { display:block; font-family:var(--rdoc-font-mono); font-size:11px; letter-spacing:1px; color:var(--rdoc-text-muted); margin:14px 0 6px; text-transform:uppercase; }
  input { width:100%; background:var(--rdoc-bg); border:1px solid var(--rdoc-line-on-surface); color:var(--rdoc-text);
          padding:11px 12px; border-radius:6px; font-size:14px; outline:none; }
  input:focus { border-color:var(--rdoc-border-strong); }
  button { width:100%; margin-top:22px; background:transparent; color:var(--rdoc-text); border:1px solid var(--rdoc-border-strong);
           padding:12px; border-radius:6px; font-weight:600; letter-spacing:1px; cursor:pointer; font-size:14px; font-family:inherit; }
  button:hover { background:var(--rdoc-bg); }
  button:disabled { opacity:.5; cursor:default; }
  #tw-login { display:block; text-align:center; background:var(--rdoc-twitch); color:var(--rdoc-offwhite);
              padding:12px; border-radius:6px; font-weight:600; letter-spacing:.5px; text-decoration:none; margin-bottom:6px; }
  #tw-login:hover { opacity:.88; }
  .err { margin-top:14px; color:var(--rdoc-error); font-size:12px; text-align:center; min-height:16px; }
</style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="on">
    <div class="logo">RDOC <b>//</b> GIVEAWAY</div>
    <div class="sub">Control Center · Login</div>

    <a id="tw-login" href="/admin/auth/twitch">Mit Twitch anmelden oder registrieren</a>
    <div style="text-align:center;font-size:11px;color:var(--rdoc-text-muted);margin:4px 0 0;line-height:1.5;">Noch kein Konto? Der erste Login legt alles an.</div>
    <div style="text-align:center;font-size:11px;color:var(--rdoc-text-muted);margin:10px 0;">— oder —</div>

    <label for="u">Benutzername</label>
    <input id="u" name="username" autocomplete="username" autofocus required>
    <label for="p">Passwort</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button id="btn" type="submit">ANMELDEN</button>
    <div class="err" id="err"></div>
  </form>
  <a href="/" style="display:block;text-align:center;margin-top:14px;font-size:12px;color:var(--rdoc-text-muted);text-decoration:none;letter-spacing:1px;">← Startseite</a>
<script>
  var f = document.getElementById('loginForm');
  var err = document.getElementById('err');
  var btn = document.getElementById('btn');
  var ERRMAP = { state:'Sitzung abgelaufen, bitte erneut.', token:'Twitch-Login fehlgeschlagen.', profile:'Twitch-Profil nicht lesbar.', notadmin:'Kein Zugang für diesen Account.', banned:'Dieses Konto wurde vom Betreiber gesperrt.', server:'Serverfehler beim Login.' };
  var qe = new URLSearchParams(location.search).get('err');
  if (qe) err.textContent = ERRMAP[qe] || ('Fehler: ' + qe);
  // Ursprünglich angeforderte Seite an den Twitch-Login durchreichen —
  // sonst landet man nach dem Login immer auf der Team-Seite.
  var nx = new URLSearchParams(location.search).get('next');
  if (nx && nx.indexOf('/') === 0 && nx.indexOf('//') !== 0) {
    document.getElementById('tw-login').href = '/admin/auth/twitch?next=' + encodeURIComponent(nx);
  }
  f.addEventListener('submit', async function(e) {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    try {
      var r = await fetch('/admin/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value })
      });
      if (r.ok) { window.location.href = (nx && nx.indexOf('/') === 0 && nx.indexOf('//') !== 0) ? nx : '/admin/'; return; }
      var d = await r.json().catch(function(){ return {}; });
      err.textContent = d.error === 'invalid_credentials' ? 'Falscher Benutzername oder Passwort.' : ('Fehler: ' + (d.error || r.status));
    } catch (ex) {
      err.textContent = 'Verbindungsfehler.';
    }
    btn.disabled = false;
  });
</script>
</body>
</html>
